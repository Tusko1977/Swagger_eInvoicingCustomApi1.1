<!DOCTYPE html>
<html>
<head>
  <title>API Docs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist/swagger-ui.css">
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist/swagger-ui-bundle.js"></script>
  <script>
    window.onload = () => {
	  const ui = SwaggerUIBundle({
		url: "/myopenapi.json",
		dom_id: "#swagger-ui",
		defaultModelsExpandDepth: -1,
	  });

	  // Scroll expanded operation to top of viewport
	  document.addEventListener("click", (e) => {
		const summary = e.target.closest(".opblock-summary");
		if (summary) {
		  const opblock = summary.closest(".opblock");
		  setTimeout(() => {
			opblock.scrollIntoView({ behavior: "smooth", block: "start" });
		  }, 100); // wait for expand animation/render
		}
	  });
	};
  </script>
</body>
</html>
